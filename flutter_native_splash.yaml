# dart run flutter_native_splash:create
#
# AFTERWARDS: set android:windowDrawsSystemBarBackgrounds back to true in all
# four android/app/src/main/res/values*/styles.xml. The generator rewrites it
# to false every single run, and it is the flag Android 15 edge-to-edge
# compliance depends on. Then revert the generator's reformat-only churn in
# Info.plist, LaunchScreen.storyboard, web/index.html and the .xcassets
# manifests. See the comment in values/styles.xml.
#
# Both images below are true alpha over the `color` window background —
# nothing carries a baked-in backdrop (checked over magenta). They are the
# Living Board "Cell S" mark: android_12_splash_dark.png is the kit's
# splash-logo-android12-1152.png (content radius 310 px, under the 384 px
# = width/3 the system circle crop allows) and splash_logo_transparent.png
# is its centre crop. No branding strip: the in-app splash draws the
# wordmark right after.
# ---------------------------------------------------------------------------
# MIAMI NIGHTS EVENT SPLASH (7.6.2, free-theme window Nov 19 - Dec 7 2026).
# REVERT in the first release after Dec 7: delete this active block, uncomment
# the CLASSIC block below, re-run the generator, redo the AFTERWARDS steps.
# A native splash is baked into the build, so installs that never update keep
# showing this one; that's harmless.
# Assets: miami_nights_bg.png is rendered from lib/design/miami_nights_scene.dart
# by `flutter test tools/render_miami_splash_test.dart`; the two miami_nights_*
# logos are the Cell S files recoloured lime -> pink (red apple kept). Generic
# sunset imagery only: no other game's name, logo or lettering.
# Android 12+ ignores background images: it shows the pink mark on dusk violet.
# ---------------------------------------------------------------------------
flutter_native_splash:
  # No top-level color: the generator ignores background_image when one is set.
  background_image: assets/splash/miami_nights_bg.png
  background_image_dark: assets/splash/miami_nights_bg.png
  image: assets/splash/miami_nights_logo.png
  image_dark: assets/splash/miami_nights_logo.png

  android_12:
    image: assets/splash/miami_nights_android_12.png
    image_dark: assets/splash/miami_nights_android_12.png
    color: "#2A0A45"
    color_dark: "#2A0A45"

