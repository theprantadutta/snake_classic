name: snake_classic
description: "A new Flutter project."

publish_to: 'none'

version: 6.6.1+57

environment:
  # Tracks the Dart SDK this project is developed/built with (Flutter
  # 3.47.0 stable ships Dart 3.13.0).
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations — 'any' defers to the SDK's version.
  intl: any

  cupertino_icons: ^1.0.8
  
  # State management
  provider: ^6.1.2
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.5
  flutter_riverpod: ^3.2.0

  # Dependency injection
  get_it: ^9.2.0

  # Functional programming helpers
  dartz: ^0.10.1
  
  # Audio system
  flutter_soloud: ^4.0.6
  
  # Persistent storage
  shared_preferences: ^2.2.3

  # Drift database for offline-first storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # Animations and effects
  flutter_animate: ^4.5.0

  # Custom fonts
  google_fonts: ^8.0.1
  
  # Vector math for game calculations
  vector_math: ^2.1.4
  
  # UUID for unique identifiers
  uuid: ^4.5.1

  # Native in-app review prompts (Google Play + StoreKit)
  in_app_review: ^2.0.10

  # Firebase dependencies
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  google_sign_in: ^7.1.1
  firebase_analytics: ^12.0.0
  
  # Connectivity for offline/online detection
  connectivity_plus: ^7.0.0
  
  # Beautiful logging library
  talker: ^5.0.0
  talker_flutter: ^5.0.0
  
  # Enhanced UI components for auth
  flutter_dotenv: ^6.0.0
  font_awesome_flutter: ^11.0.0
  
  # Push notifications
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^22.0.0-dev.3
  # `timezone` is a transitive of flutter_local_notifications but we
  # reference it directly (for zonedSchedule's TZDateTime), so the
  # depend_on_referenced_packages lint requires an explicit entry.
  timezone: ^0.11.0
  
  # HTTP client for backend communication
  http: ^1.2.2

  # SignalR for real-time multiplayer (replaces WebSocket)
  signalr_netcore: ^1.3.7
  
  # In-app purchases (OpenIAP). Play Billing Library 9.1.0 on Android,
  # StoreKit 2 on iOS. Every purchase token / signed transaction is
  # verified by our backend before anything is delivered.
  flutter_inapp_purchase: ^10.6.1

  # Ads (AdMob). Bundles the UMP consent SDK. Pro/trial users never see ads.
  google_mobile_ads: ^9.0.0
  # iOS App Tracking Transparency prompt (required alongside UMP on iOS 14+).
  app_tracking_transparency: ^2.0.7

  # URL launcher for external links
  url_launcher: ^6.3.1

  # In-app updates from Play Store
  in_app_update: ^5.0.0

  # Opts the app into the display's high refresh rate. Flutter's engine never
  # calls the platform's rate-setting APIs, so a 120 Hz phone renders the game
  # at 60 Hz unless we ask for more.
  refresh_rate: ^1.0.2

  # Declarative routing
  go_router: ^18.0.0

  # NOT used directly — a DIRECT dependency purely so we can register its
  # localization delegates. go_router 18 has migrated to package:material_ui,
  # which declares its OWN MaterialLocalizations: a different Dart type from
  # the one in package:flutter/material.dart that flutter_localizations
  # cannot satisfy. Any material_ui widget that reaches
  # debugCheckHasMaterialLocalizations throws without the delegates below.
  material_ui: ^1.1.0

  # For Splash Screen
  flutter_native_splash: ^2.4.6
  package_info_plus: ^10.1.0
  flame: ^1.37.0
  flame_bloc: ^1.12.23

  # Crash reporting, tracing and session replay. Replaced
  # firebase_crashlytics — see lib/core/observability/ for the init, the
  # error classifier and the reasoning.
  #
  # Pins `jni: 0.14.2` EXACTLY, which is why path_provider_android resolves
  # to 2.2.23 rather than 2.3.1: 2.3.x is the jnigen rewrite and needs
  # jni ^1.0.0. 2.2.23 is the stable pre-JNI implementation and behaves
  # identically for our use (the Drift database path and the log directory).
  # If sentry_flutter ever relaxes that pin, path_provider_android will
  # float back up on its own.
  sentry_flutter: ^9.30.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  flutter_launcher_icons: "^0.14.4"

  # Virtual clock for the settlement retry/backoff tests — a real one would
  # make them take minutes.
  fake_async: ^1.3.1

  # Drift code generation
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

  # Uploads the Dart obfuscation map, the split debug info and the Android
  # ProGuard mapping to Sentry after a release build. Without it every
  # release stack trace is a list of hex offsets. Configured by the
  # `sentry:` block at the bottom of this file; run with
  # `dart run sentry_dart_plugin` immediately after `flutter build`.
  sentry_dart_plugin: ^3.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # gen-l10n: generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml)
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/audio/
    - assets/images/
    # Generated pickup/effect sprites (see generate-assets.md). Flutter
    # directory entries are non-recursive, so subfolders are listed
    # explicitly.
    - assets/images/food/
    - assets/images/powerups/
    - assets/images/effects/
    - assets/legal/
    # Orbitron + Rajdhani static instances, bundled so google_fonts loads
    # them from assets instead of fetching from fonts.gstatic.com at runtime.
    # google_fonts matches these via the AssetManifest (assets: section, NOT
    # the fonts: section). Runtime fetching is disabled in main.dart.
    - assets/fonts/
    - .env
    # - assets/images/

  # Script fallbacks for locales Orbitron/Rajdhani don't cover — Cyrillic
  # (ru), Latin Extended-A (pl), Devanagari (hi) and Arabic (ar). Referenced
  # via fontFamilyFallback in GameTypography.scriptFallback, never as a
  # primary family, so Latin text is untouched. Declared here (NOT via
  # google_fonts) because runtime fetching is disabled — these must ship in
  # the bundle so non-Latin locales render identically offline on every
  # device instead of falling back to an arbitrary OS font.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

# sentry_dart_plugin — debug symbol upload (see dev_dependencies above).
#
# Deliberately NO auth_token here: pubspec.yaml is committed, and the token
# is a write credential for the whole Sentry org. The plugin reads
# SENTRY_AUTH_TOKEN from the environment, so set it in the shell / CI secret
# store before running `dart run sentry_dart_plugin`.
sentry:
  org: pranta-corp
  project: snake-classic-flutter

  # The Dart obfuscation map + split-debug-info produced by the
  # --obfuscate/--split-debug-info build flags. Without this, release
  # traces are unreadable.
  upload_debug_symbols: true
  # Source context (the code shown inline around each frame) is OFF.
  #
  # It is all-or-nothing in this plugin — there is no path filter — and
  # "all" means every debug information file in the build, not just ours.
  # On 6.6.1+57 that was 292 files: the Flutter engine, flutter_soloud's
  # bundled miniaudio, sqlite3, libdartjni, the timezone database. The
  # symbol upload itself took 13 seconds; the source pass then held 2.1 GB
  # of RSS for five minutes and died on a 300s API timeout, which failed the
  # whole command AFTER the symbols had already landed.
  #
  # Losing it costs the inline snippet only. Frames still carry file name,
  # line number and function, because that comes from the debug symbols
  # above — which is the part that makes a trace readable.
  upload_sources: false
  # Web only; the app does not ship a web build, but harmless if one is made.
  upload_source_maps: false
