org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Kotlin compiles in its own daemon rather than through the in-process Build
# Tools API.
#
# On Gradle 9.7 / AGP 9.3.1 the in-process path (BuildToolsApiCompilationWork)
# fails on Windows with "Could not close incremental caches ... *.tab" for any
# plugin module it compiles — audioplayers, firebase_analytics,
# google_sign_in, webview_flutter. It is not stale state: deleting build/
# entirely and rebuilding reproduces it on the freshly created caches, because
# the failure is the compiler not releasing its own file handles, and Windows
# will not let the cache be closed while they are open.
#
# The daemon strategy keeps incremental compilation — it just runs the
# compiler in a separate JVM that owns and releases those handles properly.
kotlin.compiler.execution.strategy=daemon

# ...and the incremental caches are off entirely, which is what actually
# fixes it. The daemon alone did not: the failure is in closing the .tab
# files themselves, so the only reliable escape is not to keep them.
#
# The cost is real but small here — this only affects Kotlin sources, and
# the app's Kotlin is a handful of plugin modules plus MainActivity. Every
# line of the game is Dart, which has its own incremental pipeline and is
# untouched by this.
kotlin.incremental=false
