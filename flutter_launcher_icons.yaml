# dart run flutter_launcher_icons
#
# Sources live in assets/icon/ and come from the Living Board kit's "Cell S"
# mark (docs/living-board/brand/). They are separate files because each
# target crops and pads differently:
#
#   adaptive_foreground.png  the mark alone on transparent, already inside
#                            the central 66% circle Android guarantees is
#                            visible on the 108dp canvas.
#   adaptive_monochrome.png  the same shape as ink coverage for themed icons.
#   legacy_icon.png          the rounded tile, for the pre-adaptive icon
#                            (API 24-25).
#   ios_icon.png             full-bleed square with no transparency (iOS
#                            masks it itself and forbids alpha).
#
# The adaptive layers are what Android 8+ actually draws.
flutter_launcher_icons:
  image_path: "assets/icon/legacy_icon.png"

  android: "launcher_icon"
  image_path_android: "assets/icon/legacy_icon.png"
  min_sdk_android: 24 # matches flutter.minSdkVersion
  adaptive_icon_background: "#0F380F"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"
  # The sources above already carry their own safe-zone padding, so the
  # generator must not inset them again.
  adaptive_icon_foreground_inset: 0

  ios: true
  image_path_ios: "assets/icon/ios_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#0F380F"
